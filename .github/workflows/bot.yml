name: Tradingbot

# GitHubs cron er upaalidelig ved 5 min. Derfor koerer et job i ca. 5,5 time
# med en runde hvert 5. minut, og starter derefter sig selv igen.
# Cron (hver time) er kun backup, hvis kaeden skulle stoppe.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:       # knap til at koere manuelt

permissions:
  contents: write
  actions: write

concurrency:
  group: tradingbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Koer en runde hvert 5. minut i ca. 5,5 time
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Valgfrie indstillinger: Settings > Secrets and variables > Actions > Variables
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '5.00' }}  # + 2,50 til small-botten = 7,50 i alt
          MAX_AI_ROUNDS_PER_DAY: ${{ vars.MAX_AI_ROUNDS_PER_DAY }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          MAX_TOTAL_EXPOSURE_PCT: ${{ vars.MAX_TOTAL_EXPOSURE_PCT }}
          COINS: ${{ vars.COINS }}
          STOCKS: ${{ vars.STOCKS }}
          EXTRA_STOCKS: EQIX,DLR  # paper-test af datacenter-jord-idéen fra 4. nov
          ORB_TREND_FILTER: ${{ vars.ORB_TREND_FILTER }}
          MARKET_FILTER: ${{ vars.MARKET_FILTER_MAIN || 'QQQ' }}  # handl med markedet: ingen nye aktiekoeb naar QQQ er under dagens snitpris ('none' = slaa fra)
          RESET_HALT: ${{ vars.RESET_HALT }}
          NEWS_MAX_CALLS_PER_DAY: ${{ vars.NEWS_MAX_CALLS_PER_DAY }}
          NEWS_MIN_GAP_MIN: ${{ vars.NEWS_MIN_GAP_MIN }}
          NEWS_MIN_STYRKE: ${{ vars.NEWS_MIN_STYRKE }}
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          DATA="trades.csv trades_v*.csv state.json lessons.md closed_trades*.csv logs OVERSIGT.md"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            timeout 270 python bot.py || echo "Runde fejlede"
            for f in $DATA; do [ -e "$f" ] && git add "$f"; done
            git commit -q -m "Bot-runde $(date -u +%Y-%m-%dT%H:%M)" || echo "Intet nyt"
            if ! git pull -q --rebase; then
              # Fx en ny fil paa main: gem botens data, hent main og laeg data ovenpaa igen
              git rebase --abort 2>/dev/null || true
              mkdir -p /tmp/botdata && cp -r $DATA /tmp/botdata/ 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq
              cp -r /tmp/botdata/. . && rm -rf /tmp/botdata
              for f in $DATA; do [ -e "$f" ] && git add "$f"; done
              git commit -q -m "Bot-runde $(date -u +%Y-%m-%dT%H:%M) (efter sync)" || true
            fi
            # Oversigt over alle 4 bots (kun hoved-botten skriver den, saa der ikke opstaar konflikter)
            python oversigt.py && git add OVERSIGT.md && git commit -q -m "Oversigt $(date -u +%H:%M)" || true
            git push -q || echo "Push fejlede"
            sleep $(( 300 - ($(date +%s) - start) > 0 ? 300 - ($(date +%s) - start) : 1 ))
          done
      - name: Start naeste kaede
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref main
