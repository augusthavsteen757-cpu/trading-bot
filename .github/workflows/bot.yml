name: Tradingbot

on:
  schedule:
    - cron: "*/5 * * * *"  # hvert 5. min (offentligt repo = gratis minutter). GitHub kan forsinke
  workflow_dispatch:       # knap til at koere manuelt

permissions:
  contents: write

concurrency:
  group: tradingbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Koer en runde
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py
      - name: Gem trades.csv
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add trades.csv state.json lessons.md 2>/dev/null || git add trades.csv state.json
          git commit -m "Bot-runde $(date -u +%Y-%m-%dT%H:%M)" || echo "Intet nyt"
          git pull --rebase -q || true
          git push
