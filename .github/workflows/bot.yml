name: Tradingbot

# GitHubs cron er upaalidelig ved 5 min. Derfor koerer et job i ca. 5,5 time
# med en runde hvert 5. minut, og starter derefter sig selv igen.
# Cron (hver time) er kun backup, hvis kaeden skulle stoppe.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:       # knap til at koere manuelt

permissions:
  contents: write
  actions: write

concurrency:
  group: tradingbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Koer en runde hvert 5. minut i ca. 5,5 time
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            timeout 180 python bot.py || echo "Runde fejlede"
            git add trades.csv state.json lessons.md 2>/dev/null || git add trades.csv state.json
            git commit -q -m "Bot-runde $(date -u +%Y-%m-%dT%H:%M)" || echo "Intet nyt"
            git pull -q --rebase || true
            git push -q || echo "Push fejlede"
            sleep $(( 300 - ($(date +%s) - start) > 0 ? 300 - ($(date +%s) - start) : 1 ))
          done
      - name: Start naeste kaede
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref main
